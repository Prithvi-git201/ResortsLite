version: '3.8'

services:
  resortslite-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: resortslite:latest
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      # Java JVM Options
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      
      # Spring Boot Configuration
      SPRING_PROFILES_ACTIVE: docker
      SPRING_APPLICATION_NAME: ResortsLite
      
      # Server Configuration
      SERVER_PORT: 8080
      
      # Database Configuration (H2 in-memory)
      SPRING_DATASOURCE_URL: jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      
      # Redis Configuration (external service - provide connection details)
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_SESSION_STORE_TYPE: redis
      
      # AWS S3 Configuration (external service)
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-resorts-lite-files}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      
      # Notification Service (external service)
      APP_NOTIFICATION_ENDPOINT: ${APP_NOTIFICATION_ENDPOINT:-http://notify.internal:7070/send}
      
      # Actuator Configuration
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: when-authorized
      
      # Timezone
      TZ: UTC
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - resortslite-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  resortslite-network:
    driver: bridge

volumes:
  logs:
  config:
