version: '3.8'

services:
  resortslite-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: resortslite:latest
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      # Java/JVM Configuration
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      SPRING_PROFILES_ACTIVE: docker
      TZ: UTC
      
      # Application Configuration
      SERVER_PORT: 8080
      
      # Redis Configuration (external service - provide connection details)
      REDIS_HOST: ${REDIS_HOST:-redis.example.com}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # AWS S3 Configuration
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-resorts-lite-files}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      
      # External Service Endpoints
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-https://inventory-service.internal:8081/rooms/available}
      
      # Database Configuration (H2 in-memory for development)
      SPRING_DATASOURCE_URL: jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  config:
