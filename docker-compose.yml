version: "3.9"

# =============================================================================
# docker-compose.yml — ResortsLite Application (single service)
# NOTE: Only the application container is defined here.
#       External services (Memcached, databases, etc.) are provided separately.
# =============================================================================

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: docker

      # JVM settings
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8 -Duser.timezone=UTC"

      # Server
      SERVER_PORT: "8080"

      # JWT secret — override with a strong secret in production
      JWT_SECRET: ${JWT_SECRET:-default-dev-secret-change-in-production}

      # Memcached (Amazon ElastiCache endpoint in production)
      MEMCACHED_ENDPOINT: ${MEMCACHED_ENDPOINT:-localhost:11211}
      MEMCACHED_EXPIRY_SECS: ${MEMCACHED_EXPIRY_SECS:-3600}

      # ALB stickiness (transitional session affinity)
      ALB_STICKINESS_ENABLED: ${ALB_STICKINESS_ENABLED:-true}
      ALB_COOKIE_DURATION_SECS: ${ALB_COOKIE_DURATION_SECS:-86400}

      # EFS-backed paths (override for local dev if needed)
      REPORT_BASE_PATH: ${REPORT_BASE_PATH:-/mnt/efs/reports}
      BACKUP_PATH: ${BACKUP_PATH:-/mnt/efs/backups}

      # External service endpoints
      APP_PAYMENT_ENDPOINT: ${APP_PAYMENT_ENDPOINT:-http://payment-svc.internal:9090/charge}
      APP_INVENTORY_ENDPOINT: ${APP_INVENTORY_ENDPOINT:-http://inventory-svc.internal:8081/rooms}
      APP_NOTIFICATION_ENDPOINT: ${APP_NOTIFICATION_ENDPOINT:-http://notify.internal:7070/send}

      # Timezone
      TZ: UTC

    volumes:
      - ./logs:/app/logs
      - efs-reports:/mnt/efs/reports
      - efs-backups:/mnt/efs/backups

    networks:
      - app-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M

volumes:
  efs-reports:
    driver: local
  efs-backups:
    driver: local

networks:
  app-network:
    driver: bridge
