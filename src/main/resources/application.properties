# ResortsLite - Legacy Configuration

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# Activates Spring Session's Redis store so all HTTP session data is kept in
# a shared ElastiCache cluster instead of in-process JVM memory.  This makes
# every application instance stateless and allows the AWS ALB to route any
# request to any instance without sticky sessions.
#
# Override these via environment variables in cloud deployments:
#   SPRING_REDIS_HOST  - ElastiCache primary endpoint (default: localhost for local dev)
#   SPRING_REDIS_PORT  - Redis port (default: 6379)
#   SPRING_SESSION_TIMEOUT - Session TTL, e.g. 30m (default: 30m)
spring.session.store-type=redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.session.timeout=${SPRING_SESSION_TIMEOUT:30m}

# ---------------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# TTL (in minutes) for booking cache entries stored in Amazon ElastiCache for Redis.
# Replaces the previous unbounded in-memory HashMap (bookingCache) that grew
# indefinitely and was invisible to other EC2 instances.
#
# Override via environment variable in cloud deployments:
#   APP_CACHE_BOOKING_TTL_MINUTES - TTL in minutes for each booking cache entry
#                                   (default: 60 minutes)
app.cache.booking-ttl-minutes=${APP_CACHE_BOOKING_TTL_MINUTES:60}

# cr-java-0090 FIX: Amazon Cognito User Pool configuration for cloud-native authentication.
# Replaces file-based MD5 authentication token generation with Amazon Cognito User Pool
# identity management. Set the following environment variables before deployment:
#   COGNITO_USER_POOL_ID  - Amazon Cognito User Pool ID (e.g., us-east-1_XXXXXXXXX)
#   COGNITO_CLIENT_ID     - Amazon Cognito App Client ID for the User Pool
#   CLOUD_AWS_REGION      - AWS region where the Cognito User Pool is deployed (default: us-east-1)
#
# These values should be stored in AWS Systems Manager Parameter Store or injected
# via ECS task definition environment variables / Elastic Beanstalk configuration.
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_PLACEHOLDER}
cognito.client-id=${COGNITO_CLIENT_ID:PLACEHOLDER_CLIENT_ID}

# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0069 FIX: Database credentials are no longer stored here.
# They are retrieved at runtime from AWS Secrets Manager.
# Set the following environment variables before deployment:
#   DB_SECRET_NAME  - Name/ARN of the AWS Secrets Manager secret (default: resortslite/db/credentials)
#   CLOUD_AWS_REGION - AWS region where the secret is stored (default: us-east-1)

# cr-java-0077 FIX: Hard-coded port replaced with environment variable injection.
# The SERVER_PORT environment variable is injected at runtime by ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment configuration.
# AWS Systems Manager Parameter Store key: /resortslite/server/port
# Set SERVER_PORT env var (or SSM parameter) before deployment; defaults to 8080 for local dev.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0062 FIX: Amazon S3 configuration for durable report storage
# Replaces local file system paths (/var/legacy/reports/, C:\ResortBackups\nightly\)
# Override these via environment variables in cloud deployments:
#   CLOUD_AWS_S3_REPORT_BUCKET, CLOUD_AWS_S3_BACKUP_PREFIX, CLOUD_AWS_REGION
cloud.aws.s3.report-bucket=${CLOUD_AWS_S3_REPORT_BUCKET:resort-reports-bucket}
cloud.aws.s3.backup-prefix=${CLOUD_AWS_S3_BACKUP_PREFIX:backups/nightly/}
cloud.aws.region=${CLOUD_AWS_REGION:us-east-1}

# cr-java-0071 FIX: Hard-coded environment URLs replaced with AWS SSM Parameter Store lookups.
# The following properties define the SSM parameter keys used to retrieve environment-specific
# URLs at runtime, enabling environment-agnostic deployments across dev/staging/production.
#
# SSM parameter key for the inventory service URL (BookingController /availability endpoint).
# Override via environment variable: APP_SSM_INVENTORY_URL_PARAM
app.ssm.inventory-url-param=${APP_SSM_INVENTORY_URL_PARAM:/resortslite/inventory/url}
#
# SSM parameter key for the report download base URL (ReportService.buildReportDownloadUrl).
# Override via environment variable: APP_SSM_REPORT_DOWNLOAD_URL_PARAM
app.ssm.report-download-url-param=${APP_SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-url}
