# ResortsLite - Application Configuration (Java 21 / Spring Boot 3.2.x)
spring.application.name=ResortsLite

# Server port — externalise via SERVER_PORT env var for container deployments (czr-port-001)
server.port=${SERVER_PORT:8080}

# PostgreSQL 16 datasource configuration.
# All sensitive values must be supplied via environment variables or a secrets manager
# (e.g. AWS Secrets Manager / Parameter Store) — never hardcoded in source (sec-cred-001).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings (PostgreSQL 16 optimised)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JDBC initialisation — create schema on startup using schema.sql if present
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Jackson date/time serialisation — use ISO-8601 (java.time compatible, Java 21)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging — Spring Boot 3.x uses Logback by default (log4j-core removed)
logging.level.com.demo.resortslite=INFO
logging.level.org.springframework=WARN

# Internal service endpoints — externalise to environment variables / Parameter Store (cr-java-0021)
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Report storage — use environment variable or cloud object storage path (czr-java-001)
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
