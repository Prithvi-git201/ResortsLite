# ResortsLite - Cloud-Ready Configuration for AWS
spring.application.name=ResortsLite

# FIXED cr-java-0077: Server port now uses environment variable for dynamic assignment
# ECS/EKS can override this via environment variables
server.port=${SERVER_PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Database credentials externalized to AWS Secrets Manager
# Connection details are retrieved at runtime from Secrets Manager
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0065, cr-java-0067: Redis Configuration for Amazon ElastiCache
# Enables distributed session management and caching across multiple instances
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Spring Session Configuration
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session
spring.session.timeout=30m

# FIXED cr-java-0071: Service endpoints externalized to AWS Systems Manager Parameter Store
# These values are injected via environment variables from Parameter Store
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: AWS S3 Configuration for file storage
# Replaces local file system dependencies with cloud-native object storage
aws.s3.reports.bucket=${S3_REPORTS_BUCKET:resorts-reports-bucket}
aws.s3.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0069, cr-java-0090: AWS Secrets Manager Configuration
# Credentials and authentication data stored in Secrets Manager
aws.secrets.database.name=${SECRETS_DB_NAME:resorts-db-credentials}
aws.secrets.auth.name=${SECRETS_AUTH_NAME:resorts-auth-credentials}

# FIXED cr-java-0071: Reports base URL externalized
app.reports.base.url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# Logging Configuration (cloud-native structured logging)
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
