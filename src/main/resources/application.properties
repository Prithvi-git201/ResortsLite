# ResortsLite - Cloud-Ready Configuration
# cr-java-0021 / cr-java-0069: Infrastructure values externalised to environment variables
spring.application.name=ResortsLite

# cr-java-0077 (Hard-coded Ports): The fixed port value 8080 has been removed.
# The port is now sourced from the SERVER_PORT environment variable, which is injected
# at runtime by the container orchestration platform (ECS task definition, EKS pod spec,
# or Elastic Beanstalk environment properties). The AWS Systems Manager Parameter Store
# parameter /resortslite/server/port is the authoritative source per environment; the
# deployment pipeline resolves that SSM parameter and sets SERVER_PORT accordingly.
# A fallback of 8080 is retained for local development only.
# SSM parameter path : /resortslite/server/port
# Environment variable: SERVER_PORT
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# cr-java-0071: Environment-specific service endpoint URLs externalised to AWS Systems Manager
# Parameter Store. Each property below maps to an SSM parameter that is resolved at deployment
# time per environment (dev / staging / production). Override via environment variables or
# supply the corresponding SSM parameter paths in your deployment pipeline.
#
# SSM parameter path : /resortslite/inventory/url
# Environment variable: INVENTORY_SERVICE_URL
inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
#
# SSM parameter path : /resortslite/report/download-base-url
# Environment variable: REPORT_DOWNLOAD_BASE_URL
report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# Amazon S3 configuration — replaces hard-coded absolute file paths (cr-java-0061)
# Override these values via environment variables AWS_S3_REPORTS_BUCKET and AWS_S3_BACKUP_BUCKET
# or set the Spring properties directly in your deployment environment.
aws.s3.reports.bucket=${AWS_S3_REPORTS_BUCKET:resorts-lite-reports}
aws.s3.backup.bucket=${AWS_S3_BACKUP_BUCKET:resorts-lite-backups}
# AWS region — override via environment variable AWS_REGION
aws.region=${AWS_REGION:us-east-1}

# cr-java-0069: AWS Secrets Manager secret name that holds the database credentials.
# The secret must be a JSON object with "username" and "password" keys, e.g.:
#   {"username":"admin","password":"<rotated-password>"}
# Set the environment variable DB_SECRET_NAME to point to your secret in AWS Secrets Manager.
# Example: DB_SECRET_NAME=resortslite/db/credentials
# Credentials are fetched at runtime — no passwords are stored in this file or in source code.
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}

# =============================================================================
# cr-java-0065: Distributed HTTP Session via Amazon ElastiCache for Redis
# =============================================================================
# Spring Session Data Redis replaces in-process HttpSession storage with a
# centralized Redis store hosted on Amazon ElastiCache.  All EC2 / ECS instances
# share the same session data, enabling stateless horizontal scaling.
#
# Required AWS infrastructure:
#   - Amazon ElastiCache cluster (Redis engine, cluster mode optional)
#   - Security group allowing inbound TCP 6379 from the application tier
#   - (Recommended) Enable in-transit encryption (TLS) on the ElastiCache cluster
#     and set spring.redis.ssl=true + spring.redis.port=6380
#
# Set the following environment variables in your ECS task definition / EKS pod
# spec / Elastic Beanstalk environment properties:
#   REDIS_HOST          — ElastiCache primary endpoint hostname
#   REDIS_PORT          — ElastiCache port (default 6379; use 6380 for TLS)
#   SESSION_TIMEOUT_SEC — Session max-inactive interval in seconds (default 1800)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Uncomment and set to true when ElastiCache in-transit encryption is enabled:
# spring.redis.ssl=true
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
server.servlet.session.timeout=${SESSION_TIMEOUT_SEC:1800}s

# =============================================================================
# cr-java-0067: Amazon ElastiCache for Redis — Booking Cache TTL Configuration
# =============================================================================
# Replaces the unbounded in-memory HashMap (bookingCache) in BookingController
# with a centralized Redis cache in Amazon ElastiCache with a configurable TTL.
#
# Benefits:
#   - Cache entries expire automatically — no unbounded memory growth
#   - All application instances share a consistent, centralized cache view
#   - Stale data is evicted after TTL expires — no manual invalidation needed
#   - Redis eviction policies (e.g., allkeys-lru) provide additional safety
#
# Set BOOKING_CACHE_TTL_MINUTES in your ECS task definition, EKS pod spec, or
# Elastic Beanstalk environment properties to control cache expiration.
# SSM parameter path: /resortslite/cache/booking-ttl-minutes
BOOKING_CACHE_TTL_MINUTES=${BOOKING_CACHE_TTL_MINUTES:30}

# =============================================================================
# cr-java-0090: Amazon Cognito User Pool configuration
# Replaces local file-based authentication credential storage and MD5-based
# token generation with Amazon Cognito for centralized user identity management.
# =============================================================================
# Cognito User Pool ID — set COGNITO_USER_POOL_ID in ECS task definition / EKS
# pod spec / Elastic Beanstalk environment properties.
# Authoritative source: AWS Systems Manager Parameter Store
#   SSM parameter path : /resortslite/cognito/user-pool-id
#   Environment variable: COGNITO_USER_POOL_ID
cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
#
# Cognito App Client ID — the App Client must have ALLOW_ADMIN_USER_PASSWORD_AUTH
# flow enabled. Set COGNITO_CLIENT_ID in your deployment environment.
# Authoritative source: AWS Systems Manager Parameter Store
#   SSM parameter path : /resortslite/cognito/client-id
#   Environment variable: COGNITO_CLIENT_ID
cognito.client-id=${COGNITO_CLIENT_ID:}
#
# Required IAM permissions for the application execution role:
#   cognito-idp:AdminInitiateAuth  — for user authentication
#   cognito-idp:AdminGetUser       — for user attribute retrieval
