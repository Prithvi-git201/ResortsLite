# ResortsLite - Cloud-Ready Configuration
# All environment-specific values are externalized to AWS Systems Manager Parameter Store
spring.application.name=ResortsLite

# FIXED cr-java-0077: Port is now configurable via environment variable
# Container orchestration (ECS/EKS) will inject the appropriate port
server.port=${SERVER_PORT:8080}

# Database Configuration
# FIXED cr-java-0069: Database credentials are now retrieved from AWS Secrets Manager
# The application loads credentials at runtime from the secret specified below
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# FIXED cr-java-0071: Service endpoints are now externalized to AWS Parameter Store
# These values are injected via environment variables from Parameter Store
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# AWS Configuration
# FIXED cr-java-0069: AWS Secrets Manager configuration for database credentials
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resorts-db-credentials}

# FIXED cr-java-0061, cr-java-0062, cr-java-0063: S3 bucket configuration for file storage
aws.s3.reports-bucket=${S3_REPORTS_BUCKET:resorts-reports-bucket}
aws.s3.backups-bucket=${S3_BACKUPS_BUCKET:resorts-backups-bucket}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0071: Report download URL externalized
app.reports.base-url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# FIXED cr-java-0065: Spring Session with Redis for distributed session management
# This enables stateless application instances with centralized session storage
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session
spring.session.timeout=3600

# FIXED cr-java-0065, cr-java-0067: Redis configuration for ElastiCache
# Used for both session management and distributed caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# Redis connection pool configuration
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Logging Configuration
# Cloud-native structured logging for CloudWatch
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator endpoints for health checks (required for ECS/EKS)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
