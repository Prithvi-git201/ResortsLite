# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# Server port - externalized to environment variable for cloud deployment
server.port=${SERVER_PORT:8080}

# Database configuration - externalized to environment variables
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.reports=${AWS_S3_BUCKET_REPORTS:resorts-reports-bucket}
aws.secretsmanager.secret.name=${AWS_SECRETS_MANAGER_SECRET:resorts-db-credentials}

# Redis Configuration for distributed session management and caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=${REDIS_TIMEOUT:2000}
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# Spring Session configuration
spring.session.store-type=redis
spring.session.redis.namespace=resorts:session
spring.session.timeout=30m

# Cache configuration
cache.ttl.minutes=${CACHE_TTL_MINUTES:30}

# External service endpoints - externalized to environment variables
payment.api.endpoint=${PAYMENT_API_ENDPOINT:https://payment-svc.internal:9090/charge}
inventory.api.endpoint=${INVENTORY_API_ENDPOINT:https://inventory-svc.internal:8081/rooms}
notification.api.endpoint=${NOTIFICATION_API_ENDPOINT:https://notify.internal:7070/send}

# Logging configuration for cloud environments
logging.level.root=INFO
logging.level.com.demo.resortslite=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
