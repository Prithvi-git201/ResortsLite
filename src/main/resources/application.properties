# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# =============================================================================
# cr-java-0065 FIX: Amazon ElastiCache for Redis — Distributed HTTP Session Store
# =============================================================================
# Spring Session Data Redis replaces in-JVM HTTP session storage with a
# centralised Redis cluster (Amazon ElastiCache).  Every HttpSession
# setAttribute/getAttribute call in BookingController is transparently
# serialised to / deserialised from Redis, making session data available to
# ALL instances in the cluster and eliminating server affinity.
#
# Required AWS infrastructure:
#   - Amazon ElastiCache for Redis cluster (single-node or cluster mode)
#   - Security group allowing inbound TCP 6379 from the application tier
#
# Supply the following environment variables at runtime (ECS task definition,
# EC2 user-data, or AWS Systems Manager Parameter Store):
#   REDIS_HOST  — ElastiCache primary endpoint  (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  — Redis port (default: 6379)
#   SESSION_TIMEOUT_SECONDS — session TTL in seconds (default: 1800 = 30 min)
# =============================================================================

# Activate Spring Session with Redis as the backing store
spring.session.store-type=redis

# Session timeout (30 minutes default; override via SESSION_TIMEOUT_SECONDS env var)
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# Redis connection — resolved from environment variables or SSM Parameter Store
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Redis connection pool (Lettuce) — tuned for cloud deployments
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2
spring.redis.lettuce.pool.max-wait=-1ms

# =============================================================================
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache with TTL
# =============================================================================
# Replaces the unbounded static HashMap (bookingCache) in BookingController that
# caused indefinite memory growth, instance-local cache state, and stale data
# inconsistencies across horizontally-scaled EC2 / ECS instances.
#
# All booking cache entries are now stored in Amazon ElastiCache for Redis with
# an explicit TTL, ensuring:
#   - Bounded memory usage (entries expire automatically after TTL)
#   - Cross-instance cache consistency (single shared Redis cluster)
#   - Stale data elimination (TTL-based expiry)
#
# Supply the following environment variable at runtime (ECS task definition,
# EC2 user-data, or AWS Systems Manager Parameter Store):
#   BOOKING_CACHE_TTL_SECONDS — TTL for booking cache entries (default: 1800 = 30 min)
#   SSM Parameter: /resortslite/cache/booking-ttl
# =============================================================================
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}

# cr-java-0069 FIX: Database credentials are no longer hard-coded in source.
# Set DB_SECRET_NAME to the AWS Secrets Manager secret that holds a JSON object
# with "username" and "password" keys for the database.
# Example secret value: {"username":"admin","password":"<your-password>"}
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# SERVER_PORT is set by ECS task definitions / EKS pod specs at runtime, sourced from
# AWS Systems Manager Parameter Store (SSM parameter: /resortslite/server/port).
# This enables dynamic port assignment by the container orchestration platform and
# eliminates the hard-coded port that prevented cloud deployment flexibility.
#
# SSM Parameter : /resortslite/server/port
# Environment variable: SERVER_PORT
# Default (local dev) : 8080
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Hard-coded environment-specific URLs replaced with externalized configuration
# sourced from AWS Systems Manager Parameter Store.
#
# SSM Parameter: /resortslite/inventory/url
# Maps to Spring property: app.inventory.url
# Used in: BookingController.checkAvailability() — replaces hard-coded
#   "http://inventory-service.internal:8081/rooms/available" (source line 66)
# Override via environment variable INVENTORY_SERVICE_URL or SSM Parameter Store.
app.inventory.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}

# SSM Parameter: /resortslite/reports/download-base-url
# Maps to Spring property: app.reports.download-base-url
# Used in: ReportService.buildReportDownloadUrl() — replaces hard-coded
#   "http://reports.resorts-internal.com:8080/download/" (source line 66)
# Override via environment variable REPORTS_DOWNLOAD_BASE_URL or SSM Parameter Store.
app.reports.download-base-url=${REPORTS_DOWNLOAD_BASE_URL:https://resorts-lite-reports.s3.us-east-1.amazonaws.com/reports/}

# cr-java-0061 FIX: Amazon S3 configuration replaces hard-coded local file paths.
# Override these values via environment variables (CLOUD_AWS_S3_BUCKET_NAME, etc.)
# or AWS Parameter Store / Secrets Manager in production.
cloud.aws.s3.bucket-name=${REPORTS_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.region=${AWS_REGION:us-east-1}
cloud.aws.s3.reports-prefix=${REPORTS_S3_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}

# =============================================================================
# cr-java-0090 FIX: Amazon Cognito User Pool — Cloud-Native Authentication
# =============================================================================
# Replaces file-based MD5 hash authentication token generation with Amazon Cognito
# User Pool for centralized, encrypted, and auditable user identity management.
#
# Required AWS infrastructure:
#   - Amazon Cognito User Pool (create via AWS Console or CloudFormation)
#   - IAM role with cognito-idp:AdminCreateUser permission
#
# Supply the following environment variables at runtime (ECS task definition,
# EC2 user-data, or AWS Systems Manager Parameter Store):
#   COGNITO_USER_POOL_ID  — Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID     — Cognito App Client ID
# =============================================================================
COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:us-east-1_PLACEHOLDER}
COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:PLACEHOLDER_CLIENT_ID}
