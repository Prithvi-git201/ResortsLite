# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# =============================================================================
# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session configuration
# =============================================================================
# Spring Session Data Redis replaces the servlet container's in-memory HttpSession
# with a distributed Redis-backed session, enabling stateless EC2 instances and
# true horizontal scaling behind the AWS Application Load Balancer.
#
# Set REDIS_HOST to the ElastiCache primary endpoint in ECS / Elastic Beanstalk.
# Set REDIS_PORT if your cluster uses a non-default port (default: 6379).
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Use Redis as the Spring Session store
spring.session.store-type=redis
# Session timeout (seconds) — matches @EnableRedisHttpSession(maxInactiveIntervalInSeconds=1800)
server.servlet.session.timeout=1800

# =============================================================================
# cr-java-0067 FIX: Amazon ElastiCache for Redis — booking cache TTL configuration
# =============================================================================
# Replaces the unbounded static in-memory HashMap (bookingCache) in BookingController
# with a TTL-controlled Redis cache entry written via RedisTemplate.
# Each booking entry is stored under the key "booking:<bookingId>" and automatically
# evicted after BOOKING_CACHE_TTL_MINUTES minutes, preventing indefinite memory growth,
# stale data inconsistencies, and instance-local cache isolation.
#
# Set BOOKING_CACHE_TTL_MINUTES via environment variable or AWS SSM Parameter Store:
#   aws ssm put-parameter --name /resortslite/cache/booking-ttl-minutes --value "30" --type String
app.cache.booking-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}

# AWS Secrets Manager — database credentials (cr-java-0069 fix)
# The secret must be a JSON object: {"username":"<user>","password":"<pass>"}
# Override the secret name via the DB_SECRET_NAME environment variable.
app.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
# Amazon S3 configuration — replaces hard-coded local file paths (cr-java-0061)
# Override these values via environment variables or AWS Parameter Store in production

# =============================================================================
# cr-java-0090 FIX: Amazon Cognito — user identity and authentication management
# =============================================================================
# Replaces file-based authentication (local credential files, hardcoded static fields,
# and MD5-based token generation) with Amazon Cognito User Pools.
# Set COGNITO_USER_POOL_ID and COGNITO_APP_CLIENT_ID via environment variables or
# AWS Systems Manager Parameter Store in ECS / Elastic Beanstalk deployments.
#   aws ssm put-parameter --name /resortslite/cognito/user-pool-id   --value "us-east-1_XXXXXXXXX" --type SecureString
#   aws ssm put-parameter --name /resortslite/cognito/app-client-id  --value "<client-id>"          --type SecureString
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
app.cognito.app-client-id=${COGNITO_APP_CLIENT_ID:}

app.s3.bucket-name=${S3_BUCKET_NAME:resort-reports-bucket}
app.s3.report-prefix=${S3_REPORT_PREFIX:reports/}
app.s3.backup-prefix=${S3_BACKUP_PREFIX:backups/nightly/}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# AWS SSM Parameter Store — externalised environment-specific URLs (cr-java-0071 fix)
# SSM parameter name for the inventory service URL (BookingController)
# Store the actual URL in SSM: aws ssm put-parameter --name /resortslite/inventory/service-url --value "https://..." --type SecureString
app.ssm.inventory-url-param=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/service-url}
# SSM parameter name for the report download base URL (ReportService)
# Store the actual URL in SSM: aws ssm put-parameter --name /resortslite/reports/download-base-url --value "https://..." --type SecureString
app.ssm.report-download-url-param=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-base-url}


# cr-java-0077 FIX: Hard-coded port replaced with environment variable injection backed by
# AWS Systems Manager Parameter Store. At runtime, ECS/EKS/Elastic Beanstalk injects the
# SERVER_PORT environment variable (sourced from SSM parameter /resortslite/server/port).
# If the environment variable is absent the application falls back to port 8080.
# To store the value in SSM:
#   aws ssm put-parameter --name /resortslite/server/port --value "8080" --type String
# To inject at runtime (ECS task definition / Elastic Beanstalk env property):
#   SERVER_PORT=<value resolved from SSM /resortslite/server/port>
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
