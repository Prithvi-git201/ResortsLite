# ResortsLite - Cloud-Ready Configuration

# ── Amazon ElastiCache for Redis — Spring Session (cr-java-0065) ───────────────
# cr-java-0065 FIX: HTTP session state is now stored in Amazon ElastiCache for Redis
# via Spring Session (@EnableRedisHttpSession in RedisSessionConfig).  All session
# attributes (e.g., "lastBooking", "guestName") are serialised to the shared Redis
# cluster so that every application instance behind the AWS ALB can read them.
# Server affinity / sticky sessions are no longer required.
#
# In production, set REDIS_HOST to the ElastiCache primary endpoint DNS name via an
# ECS task-definition environment variable, EKS ConfigMap, or Elastic Beanstalk
# environment property.  REDIS_PORT defaults to 6379 (standard Redis port).
#
# For local development, leave REDIS_HOST unset — it falls back to "localhost" so
# that a local Redis instance (e.g., `docker run -p 6379:6379 redis:7`) can be used
# without any code change.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Spring Session store type — must be "redis" to activate Spring Session Data Redis.
spring.session.store-type=redis

# Session timeout — 30 minutes (matches @EnableRedisHttpSession maxInactiveIntervalInSeconds).
# Override with SESSION_TIMEOUT env var if a different TTL is required.
spring.session.timeout=${SESSION_TIMEOUT:1800s}

# ── Amazon ElastiCache for Redis — Booking Cache TTL (cr-java-0067) ────────────
# cr-java-0067 FIX: The former unbounded static in-memory HashMap (bookingCache) in
# BookingController has been replaced with Amazon ElastiCache for Redis via
# RedisTemplate<String, Object> (configured in RedisSessionConfig).
#
# cache.booking.ttl-seconds controls how long each booking cache entry lives in Redis
# before automatic expiration. This prevents:
#   - Indefinite memory growth from unbounded cache accumulation
#   - Stale data inconsistencies across multiple Auto Scaling Group instances
#   - Out-of-memory errors on individual EC2 instances
#
# Default: 3600 seconds (1 hour). Override with CACHE_BOOKING_TTL_SECONDS env var
# in ECS task definitions, EKS pod specs, or Elastic Beanstalk environment properties.
cache.booking.ttl-seconds=${CACHE_BOOKING_TTL_SECONDS:3600}

# cr-java-0062: Local file-system write operations replaced with Amazon S3 storage.
# All former hard-coded paths (/var/legacy/reports/, C:\ResortBackups\nightly\) are
# removed; S3 bucket / prefix values are externalised here and can be overridden via
# environment variables (AWS_S3_REPORT_BUCKET, AWS_S3_REPORT_PREFIX, etc.).

spring.application.name=ResortsLite

# Server port — override with SERVER_PORT env var in ECS/EKS task definitions (czr-port-001)
server.port=${SERVER_PORT:8080}
# cr-java-0077: SSM parameter path for the server port.
# The port value is stored in AWS SSM Parameter Store at /resortslite/server-port and
# injected at runtime through the SERVER_PORT environment variable in ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment configuration. This eliminates the former
# hard-coded SERVER_PORT = 8080 constant and enables dynamic port assignment by container
# orchestration platforms and cloud service discovery mechanisms.
ssm.parameter.server-port=${SSM_PARAM_SERVER_PORT:/resortslite/server-port}
# Fallback port used only when SSM is unavailable (e.g., local development).
# In production, SERVER_PORT env var injected by ECS/EKS/Beanstalk takes precedence.
app.server.port.fallback=${SERVER_PORT_FALLBACK:8080}

# ── Amazon S3 storage configuration (cr-java-0061 / cr-java-0062) ──────────────
# Bucket that holds generated reports. Override with AWS_S3_REPORT_BUCKET env var.
aws.s3.report-bucket=${AWS_S3_REPORT_BUCKET:resorts-lite-reports}

# S3 key prefix for monthly report objects. Override with AWS_S3_REPORT_PREFIX env var.
aws.s3.report-prefix=${AWS_S3_REPORT_PREFIX:reports/}

# S3 key prefix for nightly backup objects. Override with AWS_S3_BACKUP_PREFIX env var.
aws.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# AWS region used by the S3 client. Override with AWS_REGION env var.
aws.region=${AWS_REGION:us-east-1}

# ── Database configuration ──────────────────────────────────────────────────────
# VIOLATION cr-java-0021: Hardcoded DB credentials — externalise to AWS Secrets Manager
# cr-java-0069: Hard-coded DB credentials (DB_USER / DB_PASS) removed from source code.
# Credentials are now retrieved at runtime from AWS Secrets Manager.
# Set the secret name via AWS_DB_SECRET_NAME env var; default shown below.
# The secret must be a JSON object: {"username":"<user>","password":"<pass>"}
aws.secretsmanager.db-secret-name=${AWS_DB_SECRET_NAME:resorts-lite/db-credentials}

# DB host — externalised from source code; override with DB_HOST env var.
app.db.host=${DB_HOST:db-prod.resorts-internal.com}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Internal service endpoints ──────────────────────────────────────────────────
# VIOLATION cr-java-0021: Hardcoded internal hostnames — replace with service-discovery
# or environment-variable-driven values for cloud VPC routing.
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# ── AWS SSM Parameter Store — environment URL externalisation (cr-java-0071) ───
# SSM parameter path for the inventory service URL.
# Override with SSM_PARAM_INVENTORY_URL env var or set the SSM parameter directly.
# The parameter value stored in SSM should be the full URL for the target environment.
ssm.parameter.inventory-url=${SSM_PARAM_INVENTORY_URL:/resortslite/inventory-service-url}

# SSM parameter path for the report download base URL.
# Override with SSM_PARAM_REPORT_DOWNLOAD_URL env var or set the SSM parameter directly.
ssm.parameter.report-download-url=${SSM_PARAM_REPORT_DOWNLOAD_URL:/resortslite/report-download-url}

# Fallback values used when SSM is unavailable (e.g., local development).
# These are externalised here — never hard-coded in source — per 12-factor app principles.
app.inventory.url.fallback=${INVENTORY_URL_FALLBACK:http://inventory-service.internal:8081/rooms/available}
app.report.download.url.fallback=${REPORT_DOWNLOAD_URL_FALLBACK:http://reports.resorts-internal.com:8080/download/}

# ── Amazon Cognito — User Identity Management (cr-java-0090) ───────────────────
# cr-java-0090 FIX: File-based authentication (local MD5 credential hashing) replaced
# with Amazon Cognito for centralised, encrypted, and auditable user identity management.
#
# Set COGNITO_USER_POOL_ID to the Cognito User Pool ID (e.g., us-east-1_AbCdEfGhI)
# and COGNITO_APP_CLIENT_ID to the App Client ID created in that User Pool.
# These values are injected at runtime via ECS task-definition environment variables,
# EKS ConfigMaps, or Elastic Beanstalk environment properties — never hard-coded.
#
# For local development, leave these unset; the resolveGuestIdentity() method will
# return empty attributes gracefully when Cognito is not configured.
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.app-client-id=${COGNITO_APP_CLIENT_ID:}

# Cognito region — defaults to the same region as other AWS services.
# Override with COGNITO_REGION env var if the User Pool is in a different region.
aws.cognito.region=${COGNITO_REGION:${AWS_REGION:us-east-1}}
