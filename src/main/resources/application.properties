# ResortsLite - Cloud-Ready Configuration for Azure
# FIXED: All hardcoded values replaced with environment variables and Azure services

spring.application.name=ResortsLite

# FIXED cr-java-0077: Port now configurable via environment variable for dynamic assignment
server.port=${SERVER_PORT:8080}

# FIXED cr-java-0069: Database credentials externalized to Azure Key Vault
# Connection details retrieved from environment variables
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Azure Key Vault Configuration
# FIXED cr-java-0069: Secrets management with Azure Key Vault
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://your-keyvault.vault.azure.net/}

# Azure Blob Storage Configuration
# FIXED cr-java-0061, cr-java-0062, cr-java-0063: File storage with Azure Blob Storage
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:yourstorageaccount}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}
azure.storage.backup-container-name=${AZURE_STORAGE_BACKUP_CONTAINER_NAME:backups}

# Azure Cache for Redis Configuration
# FIXED cr-java-0065, cr-java-0067: Distributed caching and session management
spring.redis.host=${REDIS_HOST:your-redis.redis.cache.windows.net}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:true}
spring.redis.timeout=${REDIS_TIMEOUT:60000}

# Spring Session Configuration
# FIXED cr-java-0065: Distributed session management with Redis
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Redis Cache Configuration
# FIXED cr-java-0067: Cache with TTL configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Azure Service Bus Configuration
# FIXED cr-java-0111: Scheduled tasks with Azure Service Bus
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-reports}

# Azure Active Directory Configuration
# FIXED cr-java-0090: Authentication with Azure AD
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_AD_CLIENT_SECRET:}
azure.activedirectory.user-group.allowed-groups=${AZURE_AD_ALLOWED_GROUPS:}

# Azure App Configuration
# FIXED cr-java-0071: Externalized configuration management
azure.appconfiguration.enabled=${AZURE_APPCONFIGURATION_ENABLED:false}
azure.appconfiguration.stores[0].endpoint=${AZURE_APPCONFIGURATION_ENDPOINT:}

# Application Service Endpoints
# FIXED cr-java-0071: Service URLs externalized to environment variables
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-service.internal:9443/payments/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-service.internal:8443/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notification-service.internal:7443/send}
app.reports.download.url=${REPORTS_DOWNLOAD_URL:https://reports.resorts-internal.com/download}

# Security Configuration
# Enable HTTPS enforcement in production
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.demo.resortslite=${APP_LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
