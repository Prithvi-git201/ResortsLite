# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port replaced with environment variable injection.
# Set the SERVER_PORT environment variable in ECS task definition, EKS pod spec,
# or Elastic Beanstalk environment configuration to assign the port dynamically.
# AWS Parameter Store parameter name: /resortslite/server-port (optional SSM override)
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# cr-java-0069 FIX: AWS Secrets Manager secret name for database credentials.
# The secret must be a JSON object with "username" and "password" keys.
# Set the DB_SECRET_NAME environment variable before deploying to AWS.
# Example: DB_SECRET_NAME=resortslite/prod/db-credentials
app.db.secret-name=${DB_SECRET_NAME:resortslite/prod/db-credentials}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Amazon S3 configuration for report storage (cr-java-0061 remediation)
# Override these via environment variables: REPORT_S3_BUCKET, REPORT_S3_PREFIX,
# REPORT_S3_BACKUP_PREFIX, and AWS_REGION before deploying to AWS.
report.s3.bucket=${REPORT_S3_BUCKET:resort-reports-bucket}
report.s3.prefix=${REPORT_S3_PREFIX:reports/}
report.s3.backup.prefix=${REPORT_S3_BACKUP_PREFIX:backups/nightly/}
# AWS region — also honoured by the AWS SDK Default Credential Provider Chain
aws.region=${AWS_REGION:us-east-1}

# cr-java-0071 FIX: AWS Systems Manager Parameter Store parameter names for environment-specific URLs.
# These properties hold the SSM *parameter names* (not the URLs themselves).
# The actual URL values are stored in SSM Parameter Store per environment (dev/staging/prod),
# enabling environment-agnostic deployments without code changes.
#
# BookingController — inventory service URL parameter name:
#   Set INVENTORY_SERVICE_URL_PARAM or override inventory.service.url.param
#   SSM parameter must contain the full inventory service URL for the target environment.
inventory.service.url.param=${INVENTORY_SERVICE_URL_PARAM:/resortslite/inventory/service-url}
#
# ReportService — report download base URL parameter name:
#   Set REPORT_DOWNLOAD_URL_PARAM or override report.download.url.param
#   SSM parameter must contain the base URL (including trailing slash) for report downloads.
report.download.url.param=${REPORT_DOWNLOAD_URL_PARAM:/resortslite/report-download-url}

# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session / Spring Data Redis
# Replace HTTP session storage with a centralised Redis cluster so that all application
# instances share the same session store, enabling stateless horizontal scaling.
#
# Set REDIS_HOST to the ElastiCache primary endpoint DNS name before deploying to AWS.
# Set REDIS_PORT if the cluster uses a non-default port (default: 6379).
# Example (ECS task definition environment variables):
#   REDIS_HOST=my-cluster.abc123.ng.0001.use1.cache.amazonaws.com
#   REDIS_PORT=6379
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Session TTL in minutes — must match @EnableRedisHttpSession.maxInactiveIntervalInSeconds / 60
# Override via SESSION_TTL_MINUTES environment variable.
session.ttl.minutes=${SESSION_TTL_MINUTES:30}

# cr-java-0067 FIX: Booking cache TTL in minutes for Amazon ElastiCache for Redis.
# Replaces the unbounded static in-memory bookingCache HashMap (HashMap without TTL).
# Cache entries stored under "cache:booking:<bookingId>" expire automatically after this
# duration, preventing indefinite memory growth, stale data, and cross-instance cache
# inconsistency in AWS Auto Scaling Groups.
# Override via CACHE_TTL_MINUTES environment variable (e.g. in ECS task definition).
cache.ttl.minutes=${CACHE_TTL_MINUTES:60}

# cr-java-0090 FIX: Amazon Cognito configuration for user identity management.
# Authentication credentials and user data are no longer stored in local files.
# Instead, all identity operations are delegated to Amazon Cognito User Pools.
#
# Set COGNITO_USER_POOL_ID to the Cognito User Pool ID for the target environment.
# Example: us-east-1_AbCdEfGhI
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_placeholder}
#
# Set COGNITO_CLIENT_ID to the Cognito App Client ID (public client, no secret required
# for USER_PASSWORD_AUTH flow when the app client is configured without a client secret).
# Example: 1abc2defghij3klmnopqrstu4v
cognito.client-id=${COGNITO_CLIENT_ID:placeholder-client-id}
#
# AWS Secrets Manager is used for DB credential storage (see app.db.secret-name above).
# Amazon Cognito is used for user identity management (see cognito.user-pool-id above).
