# Test profile configuration for ResortsLite
# Uses H2 in-memory database for isolated test execution

spring.application.name=ResortsLite-Test

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 console disabled in tests
spring.h2.console.enabled=false

# DDL auto-create for test schema
spring.sql.init.mode=always

# Disable MySQL auto-configuration in tests
spring.autoconfigure.exclude=

# Server port for tests
server.port=0
