# Test configuration — uses H2 in-memory database instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable PostgreSQL-specific settings for tests
server.port=8080

# Test service endpoints
app.payment.endpoint=https://payment-svc.internal:9090/charge
app.inventory.endpoint=https://inventory-svc.internal:8081/rooms
app.report.base-path=/tmp/reports/
app.backup.path=/tmp/backups/
app.report.download.host=reports.resorts-internal.com
