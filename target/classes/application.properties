# ResortsLite — Application Configuration
# Java 21 / Spring Boot 3.2.x compatible

spring.application.name=ResortsLite

# Server port — override with SERVER_PORT env var for container deployments (ECS/EKS).
# Updated czr-port-001: fixed port replaced with environment-variable-driven configuration.
server.port=${SERVER_PORT:8080}

# ── H2 In-Memory Database (development / CI) ──────────────────────────────────
# Updated cr-java-0021: datasource URL, username, and password are now driven by
# environment variables so production deployments can inject real credentials via
# AWS Parameter Store / Secrets Manager without touching this file.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Internal Service Endpoints ────────────────────────────────────────────────
# Updated cr-java-0021 / cr-java-0088: hardcoded internal hostnames replaced with
# environment-variable references; plain HTTP replaced with HTTPS.
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal:7070/send}

# ── Report Storage ────────────────────────────────────────────────────────────
# Updated czr-java-001: absolute file paths replaced with environment-variable references.
app.report.base-path=${REPORT_BASE_PATH:${java.io.tmpdir}/reports/}
app.report.backup-path=${BACKUP_PATH:${java.io.tmpdir}/backups/}
