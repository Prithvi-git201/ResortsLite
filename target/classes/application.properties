# ResortsLite - Application Configuration (Java 21 / Spring Boot 3.2.x)
spring.application.name=ResortsLite

# Server port — externalise via SERVER_PORT env var for container deployments (czr-port-001)
server.port=${SERVER_PORT:8080}

# H2 in-memory datasource (demo). For production use environment variables / Secrets Manager.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# H2 console (disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson date/time serialisation — use ISO-8601 (java.time compatible, Java 21)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging — Spring Boot 3.x uses Logback by default (log4j-core removed)
logging.level.com.demo.resortslite=INFO
logging.level.org.springframework=WARN

# Internal service endpoints — externalise to environment variables / Parameter Store (cr-java-0021)
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
