# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# EFS-backed file path environment variables for ECS Fargate volume mounts (cz-java-0057 fix)
REPORT_BASE_PATH=/mnt/efs/reports/
BACKUP_PATH=/mnt/efs/backups/nightly/

# Health check endpoint configuration (health-check-endpoint)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# cz-java-0069: ALB Session Affinity — Transitional Strategy for ECS Fargate
# Enable duration-based sticky sessions on the ALB target group so that clients
# are consistently routed to the same ECS Fargate task while the full stateless
# migration is completed.  The settings below align the Spring session cookie
# with the ALB stickiness cookie (AWSALB / AWSALBCORS).
#
# ALB target group stickiness must also be enabled via IaC / AWS Console:
#   Stickiness type  : lb_cookie (Load balancer generated cookie)
#   Stickiness duration: 86400 seconds (adjust to match application session TTL)
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
