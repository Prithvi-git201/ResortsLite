# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# EFS-backed file paths for ECS Fargate (override via REPORT_BASE_PATH / BACKUP_PATH env vars)
REPORT_BASE_PATH=/mnt/efs/reports
BACKUP_PATH=/mnt/efs/backups

# Health check endpoint configuration (mandatory containerization requirement)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------------
# cz-java-0069 — In-Memory Session Storage: ALB Session Affinity (Transitional)
# ---------------------------------------------------------------------------
# As a low-effort transitional measure while the full Redis migration is
# completed, ALB target group stickiness (duration-based lb_cookie) is enabled
# on the ECS Fargate service so that requests from the same client are routed
# to the same container replica, minimising in-memory session disruption.
#
# Required ECS / ALB settings (AWS Console, CDK, or Terraform):
#   stickiness.enabled                    = true
#   stickiness.type                       = lb_cookie
#   stickiness.lb_cookie.duration_seconds = 86400
#
# Environment variables injected via ECS Task Definition:
#   ALB_STICKINESS_ENABLED   = ${ALB_STICKINESS_ENABLED:true}
#   ALB_COOKIE_DURATION_SECS = ${ALB_COOKIE_DURATION_SECS:86400}
alb.stickiness.enabled=${ALB_STICKINESS_ENABLED:true}
alb.cookie.duration.seconds=${ALB_COOKIE_DURATION_SECS:86400}

# ---------------------------------------------------------------------------
# cz-java-0070 — Local Caches: Amazon ElastiCache for Memcached
# ---------------------------------------------------------------------------
# The local in-memory HashMap cache (bookingCache) has been replaced with
# Amazon ElastiCache for Memcached. The cluster endpoint is injected via the
# MEMCACHED_ENDPOINT environment variable, which ECS Fargate resolves from
# AWS SSM Parameter Store at task startup.
#
# AWS SSM Parameter Store path (example):
#   /resortslite/prod/memcached/endpoint
#     → my-cluster.abc123.cfg.use1.cache.amazonaws.com:11211
#
# Environment variables injected via ECS Task Definition (from SSM Parameter Store):
#   MEMCACHED_ENDPOINT    = ${MEMCACHED_ENDPOINT:localhost:11211}
#   MEMCACHED_EXPIRY_SECS = ${MEMCACHED_EXPIRY_SECS:3600}
MEMCACHED_ENDPOINT=${MEMCACHED_ENDPOINT:localhost:11211}
MEMCACHED_EXPIRY_SECS=${MEMCACHED_EXPIRY_SECS:3600}
